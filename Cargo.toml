[workspace]
resolver = "2"
members = ["crates/qobuz-core", "crates/qobuz-gui"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["Qobuz-dl contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
