name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Package ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (aarch64)
            format: dmg
            artifacts: |
              target/release/**/*.dmg
          - os: windows-latest      # x64
            format: nsis
            artifacts: |
              target/release/**/*setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Sync version from tag into workspace Cargo.toml
        # The gui crate inherits this via version.workspace = true, and
        # cargo-packager reads the crate version from the manifest metadata.
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          sed -E "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml > "$tmp"
          mv "$tmp" Cargo.toml
          echo "----- Cargo.toml -----"
          grep -n '^version = ' Cargo.toml

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build release binary
        # cargo-packager bundles an already-built binary from target/release;
        # it does not compile the app itself, so build it first.
        run: cargo build --release -p qobuz-gui

      - name: Package (${{ matrix.format }})
        working-directory: crates/qobuz-gui
        run: cargo packager --release --formats ${{ matrix.format }} --verbose

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
