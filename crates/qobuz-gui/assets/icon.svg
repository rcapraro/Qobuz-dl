<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6a0f6"/>
      <stop offset="1" stop-color="#8aadf4"/>
    </linearGradient>
    <radialGradient id="label" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#f5bde6"/>
      <stop offset="1" stop-color="#f5a97f"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Vinyl disc -->
  <circle cx="256" cy="256" r="176" fill="#181926"/>

  <!-- Grooves -->
  <g fill="none" stroke="#cad3f5" stroke-opacity="0.10">
