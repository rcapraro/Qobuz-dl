    <circle cx="256" cy="256" r="144" stroke-width="2"/>
    <circle cx="256" cy="256" r="126" stroke-width="2"/>
    <circle cx="256" cy="256" r="108" stroke-width="2"/>
  </g>

  <!-- Top sheen -->
  <path d="M256 80 A176 176 0 0 1 432 256" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>

  <!-- Center label -->
  <circle cx="256" cy="256" r="78" fill="url(#label)"/>

  <!-- Download arrow (music + download) -->
